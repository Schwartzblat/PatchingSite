<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Nothing inline in this file: production serves a CSP of script-src 'self' and
      style-src 'self', which would block an inline <script> or <style> here.
    -->
    <!-- sizes="32x32" keeps browsers that understand SVG icons from picking the .ico. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060a" />
    <!--
      This file is a template. `npm run build` writes one copy per route
      (scripts/prerender.js) and in each one replaces the title element below with the tags
      that page's PageTitle renders (title, description, robots), points the
      canonical link and og:url at the route, and gives og:/twitter: the page's own
      title and description. There is deliberately no description here: PageTitle
      renders it, and a second one would compete with it.
    -->
    <title>AndroidMod – Patched WhatsApp</title>
    <link rel="canonical" href="https://androidmod.site/" />
    <meta property="og:url" content="https://androidmod.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AndroidMod" />
    <meta property="og:title" content="AndroidMod" />
    <meta
      property="og:description"
      content="A patched WhatsApp for Android, signed and ready to install."
    />
    <!-- Link unfurlers fetch this without a page context, so it must be absolute. -->
    <meta property="og:image" content="https://androidmod.site/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AndroidMod: patched WhatsApp builds for Android." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AndroidMod" />
    <meta
      name="twitter:description"
      content="A patched WhatsApp for Android, signed and ready to install."
    />
    <meta name="twitter:image" content="https://androidmod.site/og-image.png" />
    <meta name="twitter:image:alt" content="AndroidMod: patched WhatsApp builds for Android." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
