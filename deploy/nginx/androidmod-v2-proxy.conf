# Proxy settings for the v2 server (deploy/patchingsite-v2.service), which runs
# beside the live one. Installed as /etc/nginx/snippets/androidmod-v2-proxy.conf
# and included by every location in androidmod-v2.conf.
#
# androidmod-proxy.conf with two differences: it drops the /v2 prefix and goes to
# port 8001. The server answers root-relative /api paths (a signed download URL is
# /api/downloads/...), and the v2 store app puts its base URL,
# https://androidmod.site/v2, in front of each one, so they come back here.

rewrite ^/v2(/api/.*)$ $1 break;
proxy_pass http://127.0.0.1:8001;
proxy_http_version 1.1;

proxy_set_header Host              $host;
# The rate limiter keys on X-Real-IP (set here to the real peer, which
# proxy_set_header OVERWRITES so a client cannot forge it), falling back to
# the RIGHTMOST X-Forwarded-For hop. Keep X-Real-IP set, or the limiter is
# left trusting a header the client can prepend to. uvicorn also runs with
# --forwarded-allow-ips=127.0.0.1 so only this proxy is trusted.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Signed APKs are 40-155MB. Stream them straight through instead of
# spooling to nginx's temp dir first.
proxy_buffering off;
proxy_max_temp_file_size 0;

# Enqueue and poll return immediately; this covers the file transfer
# itself on a slow connection.
proxy_read_timeout 600s;
proxy_send_timeout 600s;
