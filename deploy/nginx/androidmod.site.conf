# Reverse proxy + SPA host for androidmod.site.
#
# Installed as /etc/nginx/sites-available/androidmod.site (symlinked into
# sites-enabled), together with the two snippets and the http-level file next to
# it, by deploy/launch-setup.sh. These are the live host's paths.

server {
    listen 80;
    listen [::]:80;
    server_name androidmod.site www.androidmod.site;
    # nginx.conf sets `server_tokens build` at http level, so it cannot be
    # switched off in conf.d (a duplicate directive fails `nginx -t`). Every
    # server block here overrides it instead.
    server_tokens off;
    # Everything is HTTPS, on the bare domain. The session cookie is Secure in
    # production, so the site simply will not log anyone in over plaintext.
    return 301 https://androidmod.site$request_uri;
}

# www only redirects. It needs its own DNS record and a certificate that names
# it (`certbot certonly --nginx --cert-name androidmod.site -d androidmod.site
# -d www.androidmod.site`); until then nobody can reach this block at all.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.androidmod.site;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/androidmod.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/androidmod.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/androidmod-headers.conf;
    return 301 https://androidmod.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name androidmod.site;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/androidmod.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/androidmod.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # add_header is inherited only by locations that declare no add_header of
    # their own. Every location below that adds a header therefore includes the
    # snippet again; without that, /assets/ silently lost HSTS and nosniff.
    include snippets/androidmod-headers.conf;

    # Built SPA, copied here by deploy/deploy.sh (nginx cannot read the
    # deploy user's home).
    root /var/www/androidmod.site;
    index index.html;

    # Hashed asset filenames, so they can be cached hard. ^~ keeps the regex
    # location for unhashed files below from claiming /assets/*.png.
    location ^~ /assets/ {
        include snippets/androidmod-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Every page is its own prerendered file (client/scripts/prerender.js):
    # dist/index.html for "/", dist/<path>.html for the rest, dist/404.html for
    # anything else. They must all be revalidated on every visit. deploy.sh copies
    # the new build with rsync --delete, which removes the previous hashed
    # bundles, so a browser that heuristically cached an old page would request
    # assets that are gone and render a blank page.
    location = / {
        include snippets/androidmod-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Unhashed public files (favicon, share image, robots.txt): a day is short
    # enough that a changed image shows up without a rename. `expires` is not
    # add_header, so the server-level headers still apply here.
    location ~* \.(?:ico|png|webp|svg|txt|xml)$ {
        expires 1d;
        try_files $uri =404;
    }

    # /apps/whatsapp is served from apps/whatsapp.html. A path with no file gets
    # 404.html and a real 404: falling back to one app shell answered 200 with
    # the home page's head for any URL at all, which search engines index as soft
    # 404s and duplicates of the home page. The build writes a file for every
    # route the app has, including the ones it renders only in the browser
    # (/login, /reset-password), so nothing the app links to lands here.
    #
    # A trailing slash is redirected away rather than given its own copy; the
    # router used to accept both, and an old link with one should still work.
    # /api/ and /assets/ are ^~ locations, so the rewrite never sees them.
    location / {
        include snippets/androidmod-headers.conf;
        add_header Cache-Control "no-cache" always;
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri.html =404;
        error_page 404 /404.html;
    }

    # ^~ for the same reason: an API path must never reach the static-file regex.
    location ^~ /api/ {
        include snippets/androidmod-proxy.conf;
    }

    # Bundle uploads are raw zips of up to 16 MiB (the server enforces that);
    # nginx's 1 MB default would refuse them with a 413 before they arrive.
    # Exact match, so every other route keeps the default limit. The upload is
    # authenticated by X-Internal-Token; the client_max_body_size only bounds
    # what nginx buffers, 17m leaving headroom over the application's cap.
    location = /api/internal/bundles {
        client_max_body_size 17m;
        include snippets/androidmod-proxy.conf;
    }

    # The store APK (~28MB) is public, so it is the cheapest thing on the site
    # to hammer. Downloads through the signed-URL endpoint need a subscription
    # and are already limited per user by the app.
    location = /api/store/download {
        limit_req zone=androidmod_store burst=5 nodelay;
        limit_conn androidmod_conn 3;
        include snippets/androidmod-proxy.conf;
    }

    # Health endpoint, handy for uptime checks.
    location = /api/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # Generic reports are stored without account or IP; keep the request out of the
    # access log too (inert until the live server runs the generic code).
    location = /api/generic/reports {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # The v2 server under /v2/api/ (deploy/patchingsite-v2.service).
    include snippets/androidmod-v2.conf;
}
