# The v2 server's locations: androidmod.site.conf's /api locations again under
# /v2. Installed as /etc/nginx/snippets/androidmod-v2.conf and included inside
# the androidmod.site server block. Only the API moves: the website stays the
# live one, which the v2 server's emails and payment pages link to (FRONTEND_URL).
# Prefix and exact matches only, so the site's static-file regex never sees these.

location ^~ /v2/api/ {
    include snippets/androidmod-v2-proxy.conf;
}

location = /v2/api/internal/bundles {
    client_max_body_size 17m;
    include snippets/androidmod-v2-proxy.conf;
}

# Same per-IP zone as the live store download: one budget for both.
location = /v2/api/store/download {
    limit_req zone=androidmod_store burst=5 nodelay;
    limit_conn androidmod_conn 3;
    include snippets/androidmod-v2-proxy.conf;
}

location = /v2/api/health {
    include snippets/androidmod-v2-proxy.conf;
    access_log off;
}

# Customer reports are stored without account or IP; keep the request out of the access log too.
location = /v2/api/generic/reports {
    include snippets/androidmod-v2-proxy.conf;
    access_log off;
}
