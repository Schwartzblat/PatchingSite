# Security headers for androidmod.site. Installed as
# /etc/nginx/snippets/androidmod-headers.conf and included at server level AND
# in every location that sets its own add_header (nginx drops inherited
# add_headers in any location that declares one).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# The SPA is one same-origin bundle: no inline scripts or styles, no external
# fonts, and the only API of its own is /api on this origin. Stripe Checkout and
# the billing portal are top-level navigations to stripe.com, which CSP does not
# restrict. React's style={{}} props go through the CSSOM, which style-src does
# not block either. Anything new that loads from another origin has to be added
# here, or it fails silently in the browser.
#
# Google Analytics is the one third party allowed to run code here:
#   script-src   googletagmanager.com serves gtag.js.
#   connect-src  gtag.js posts hits to google-analytics.com, and to a
#                region1.* style host chosen per visitor, hence the wildcards.
#   img-src      the transport falls back to a pixel when fetch/beacon is
#                unavailable.
# 'unsafe-inline' is deliberately still absent. Google's published snippet needs
# it, so the site does not use that snippet: client/src/lib/analytics.js creates
# the script element instead, and a created element is matched by URL rather
# than as inline code. Keep it that way; adding 'unsafe-inline' here would hand
# every future XSS a working script tag.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
