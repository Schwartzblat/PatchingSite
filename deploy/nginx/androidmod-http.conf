# http-level settings for androidmod.site. Installed as
# /etc/nginx/conf.d/androidmod-http.conf, which nginx.conf includes inside http{}.
#
# Only directives that Ubuntu's stock nginx.conf leaves commented out belong
# here: `gzip on` and `server_tokens` are already set there, and repeating a
# directive in the same context fails `nginx -t`.

# The JS bundle is ~300KB raw and ~95KB gzipped. Stock nginx.conf turns gzip on
# but leaves gzip_types commented, so only text/html was ever compressed.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

# Per-IP limits for the public store APK (see its location in the site file).
limit_req_zone $binary_remote_addr zone=androidmod_store:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=androidmod_conn:10m;
limit_req_status 429;
limit_conn_status 429;
