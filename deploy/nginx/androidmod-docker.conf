# androidmod.site on a host whose own nginx keeps ports 80 and 443 (it serves
# other sites too) while the site runs in Docker with TLS_MODE=external.
#
# Installed in place of deploy/nginx/androidmod.site.conf, as
# /etc/nginx/sites-available/androidmod.site (README, "Switch a host to Docker
# in place"). The host terminates TLS with its own certificate, renewed by its
# own certbot (`authenticator = nginx`, which works on these server blocks), and
# forwards everything to the web container on 127.0.0.1:8081, the HTTP_PORT in
# .env. The container has the site's routes, headers and rate limits: nothing
# here adds a header or limits a request, so the two cannot drift.

server {
    listen 80;
    listen [::]:80;
    server_name androidmod.site www.androidmod.site;
    # nginx.conf sets `server_tokens build` at http level; override it here.
    server_tokens off;
    # Everything is HTTPS, on the bare domain. certbot's nginx plugin answers
    # its challenges here by itself while renewing.
    return 301 https://androidmod.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # www too: the container redirects it to the bare domain.
    server_name androidmod.site www.androidmod.site;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/androidmod.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/androidmod.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Bundle uploads (POST /api/internal/bundles) are raw zips of up to 16 MiB;
    # the container allows 17m on that route alone and nginx's 1 MB default
    # everywhere else, so this outer limit only has to let them through.
    client_max_body_size 17m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        # OVERWRITTEN, never appended: the container takes X-Real-IP as the
        # visitor's address (deploy/docker/nginx/realip.conf) for its rate
        # limits and the app's, so a visitor must not be able to choose it.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Signed APKs are 40-155MB: stream them straight through, as the
        # container does, instead of spooling them to a temp file first.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
