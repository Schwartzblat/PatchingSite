# http-level settings for the site. Copied into the web image as
# /etc/nginx/conf.d/androidmod-http.conf, which the image's nginx.conf includes
# inside http{}. The same directives as deploy/nginx/androidmod-http.conf on the
# old host, plus the two that Ubuntu's stock nginx.conf set there and the
# official nginx image leaves off.

gzip on;
# No `Server: nginx/1.x` header or version on error pages. Every server block
# says it again, as on the old host.
server_tokens off;

# The JS bundle is ~300KB raw and ~95KB gzipped. Without gzip_types only
# text/html is compressed.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

# Per-IP limits for the public store APK (see its location in the site file).
# The web container runs on the host network, so $binary_remote_addr is the
# real client, not a Docker bridge gateway.
limit_req_zone $binary_remote_addr zone=androidmod_store:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=androidmod_conn:10m;
limit_req_status 429;
limit_conn_status 429;
