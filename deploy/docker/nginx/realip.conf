# TLS_MODE=external only: the visitor's address comes from the host's nginx.
# Copied into the web image as /etc/nginx/snippets/androidmod-realip.conf and
# included by the external templates.
#
# Every connection here comes from the host's nginx on 127.0.0.1, which sets
# X-Real-IP to the visitor's address (overwriting whatever the visitor sent).
# Taking it as $remote_addr makes the rate limits (http.conf), the access log
# and the X-Real-IP passed on to the app (proxy.conf.template) all see the
# visitor rather than 127.0.0.1. Only from 127.0.0.1: this server listens on
# loopback alone, and nothing else may choose the address.
set_real_ip_from 127.0.0.1;
real_ip_header X-Real-IP;
