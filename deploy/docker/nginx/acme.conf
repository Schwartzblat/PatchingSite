# Let's Encrypt's HTTP-01 challenge files, written by `certbot --webroot -w
# /var/www/certbot`. Copied into the web image as
# /etc/nginx/snippets/androidmod-acme.conf and included by every plain-HTTP
# server. ^~ beats the `location /` that redirects to HTTPS, so issuing or
# renewing a certificate never depends on HTTPS already working.

location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
}
