# TLS settings for every HTTPS server. Copied into the web image as
# /etc/nginx/snippets/androidmod-tls.conf.
#
# Replaces certbot-nginx's /etc/letsencrypt/options-ssl-nginx.conf, which the
# old host included: the same values, except that the cipher list keeps only
# its ECDHE suites. Without the DHE ones no ssl_dhparam file is needed, and every
# client that speaks TLS 1.2 offers ECDHE anyway.

ssl_session_cache shared:le_nginx_SSL:10m;
ssl_session_timeout 1440m;
ssl_session_tickets off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
